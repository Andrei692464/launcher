<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecționare...</title>
    <!-- Redirecționare prin meta tag (siguranță după 0 secunde) -->
    <meta http-equiv="refresh" content="0; url=https://frcraft.vercel.app/">
</head>
<body>
    <p>Dacă nu ești redirecționat automat, <a href="https://frcraft.vercel.app/">apasă aici</a>.</p>

    <!-- Redirecționare instantanee prin JavaScript -->
    <script>
        window.location.href = "https://frcraft.vercel.app/";
    </script>
</body>
</html>
